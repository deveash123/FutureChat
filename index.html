<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEXUS OS</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#000000">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #000000; --card: #121212; --card-light: #1E1E1E;
            --accent: #00D2FF; --text: #FFFFFF; --text-dim: #888888;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Plus Jakarta Sans', sans-serif; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }

        /* VIEWS */
        .view { position: absolute; top: 0; left: 0; width: 100%; height: 100%; overflow-y: auto; padding-bottom: 90px; display: none; background: var(--bg); }
        .view.active { display: block; z-index: 10; animation: fadeIn 0.3s ease; }

        /* HEADER */
        .header { padding: 20px; display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.9); position: sticky; top: 0; z-index: 50; }
        .header h1 { margin: 0; font-size: 1.5rem; }
        .add-btn { width: 35px; height: 35px; background: var(--accent); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: black; border: none; font-size: 1.2rem; cursor: pointer; }

        /* FEED CARD */
        .feed-card { position: relative; margin: 15px; border-radius: 20px; overflow: hidden; background: var(--card); }
        .feed-img { width: 100%; height: auto; display: block; }
        .feed-info { padding: 15px; }

        /* LIST ITEM */
        .list-item { display: flex; align-items: center; gap: 15px; padding: 15px 20px; border-bottom: 1px solid #222; cursor: pointer; }
        .avatar { width: 50px; height: 50px; border-radius: 50%; border: 2px solid #333; }
        
        /* CHAT UI (Exact Match) */
        .chat-room { display: flex; flex-direction: column; height: 100%; }
        .chat-profile { text-align: center; padding: 20px; background: var(--bg); border-bottom: 1px solid #222; }
        .chat-profile img { width: 80px; height: 80px; border-radius: 50%; border: 3px solid var(--accent); }
        .action-row { display: flex; gap: 10px; justify-content: center; margin-top: 15px; }
        .action-btn { background: var(--card-light); border: 1px solid #333; color: var(--accent); padding: 10px 20px; border-radius: 12px; font-weight: 600; flex: 1; max-width: 100px; display: flex; flex-direction: column; align-items: center; gap: 5px; font-size: 0.8rem; cursor: pointer; }
        .action-btn:active { background: #333; }

        .messages-area { flex-grow: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        .msg { padding: 12px 18px; border-radius: 18px; max-width: 80%; font-size: 1rem; word-wrap: break-word; }
        .msg-me { align-self: flex-end; background: var(--accent); color: black; border-bottom-right-radius: 4px; }
        .msg-other { align-self: flex-start; background: var(--card-light); color: white; border-bottom-left-radius: 4px; }
        .chat-image { max-width: 100%; border-radius: 10px; }

        /* CHAT INPUT BAR (The Buttons) */
        .chat-bar { padding: 20px; background: var(--bg); border-top: 1px solid #222; }
        .input-box { width: 100%; background: #1E1E1E; border: none; color: white; padding: 15px; border-radius: 12px; margin-bottom: 15px; outline: none; font-size: 1rem; }
        .btn-row { display: flex; gap: 15px; }
        .big-btn { flex: 1; padding: 15px; border-radius: 12px; border: none; font-weight: bold; font-size: 1rem; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-blue { background: var(--accent); color: black; }
        .btn-dark { background: var(--card-light); color: white; border: 1px solid #333; }

        /* NAVBAR */
        .navbar { position: fixed; bottom: 0; width: 100%; height: 85px; background: rgba(0,0,0,0.95); border-top: 1px solid #222; display: flex; justify-content: space-around; padding-top: 15px; z-index: 100; }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 5px; color: var(--text-dim); font-size: 0.7rem; cursor: pointer; }
        .nav-item.active { color: var(--accent); }
        .nav-item i { font-size: 1.5rem; }

        /* MODALS */
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 200; display: none; align-items: center; justify-content: center; }
        .modal-box { background: var(--card); padding: 30px; border-radius: 20px; width: 85%; border: 1px solid #333; text-align: center; }
        .modal-input { width: 100%; padding: 15px; background: #000; border: 1px solid #333; color: white; border-radius: 10px; margin-bottom: 15px; outline: none; }
        
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    <div id="login-modal" class="modal" style="display:flex; background:black;">
        <div class="modal-box" style="border:none;">
            <h1 style="font-size: 2rem; margin-bottom: 30px; color:var(--accent);">NEXUS OS</h1>
            <input id="username" class="modal-input" placeholder="Enter Codename">
            <button onclick="login()" class="big-btn btn-blue">Enter System</button>
        </div>
    </div>

    <div id="edit-modal" class="modal">
        <div class="modal-box">
            <h3>Edit Profile</h3>
            <input id="edit-bio" class="modal-input" placeholder="New Bio...">
            <div class="btn-row">
                <button onclick="document.getElementById('edit-modal').style.display='none'" class="big-btn btn-dark">Cancel</button>
                <button onclick="saveProfile()" class="big-btn btn-blue">Save</button>
            </div>
        </div>
    </div>

    <div id="view-explore" class="view active">
        <div class="header"><h1>Discover</h1> <button class="add-btn" onclick="document.getElementById('postFile').click()"><i class="ri-add-line"></i></button></div>
        <div id="feed-container"></div>
    </div>

    <div id="view-messages" class="view">
        <div class="header"><h1>Chats</h1> <button class="add-btn"><i class="ri-add-line"></i></button></div>
        <div id="chat-list">
            <div class="list-item" onclick="openChat('Global')">
                <img src="https://api.dicebear.com/7.x/initials/svg?seed=Global" class="avatar">
                <div><h3>Global Chat</h3><p style="color:#666">Tap to join</p></div>
            </div>
        </div>
    </div>

    <div id="view-chat-room" class="view" style="z-index: 20; background:black;">
        <div class="chat-room">
            <div class="header">
                <i class="ri-arrow-left-line" style="font-size:1.5rem;" onclick="closeChat()"></i>
                <h3 id="room-title">Chat</h3>
                <i class="ri-more-2-fill"></i>
            </div>
            
            <div class="chat-profile">
                <img id="room-avatar" src="">
                <h2 id="room-user" style="margin:10px 0 5px 0;">User</h2>
                <span style="color:#666">private connection</span>
                <div class="action-row">
                    <button class="action-btn" onclick="alert('Calling...')"><i class="ri-phone-line"></i> Call</button>
                    <button class="action-btn" onclick="alert('Starting Video...')"><i class="ri-vidicon-line"></i> Video</button>
                    <button class="action-btn" onclick="alert('User Info')"><i class="ri-information-line"></i> Info</button>
                </div>
            </div>

            <div id="msg-container" class="messages-area"></div>
            
            <div class="chat-bar">
                <input id="msg-input" class="input-box" placeholder="Type a message..." autocomplete="off">
                <div class="btn-row">
                    <button class="big-btn btn-blue" onclick="sendMsg()"><i class="ri-send-plane-fill"></i> Send</button>
                    <button class="big-btn btn-dark" onclick="document.getElementById('attachFile').click()"><i class="ri-attachment-line"></i> Attach</button>
                </div>
            </div>
        </div>
    </div>

    <div id="view-profile" class="view">
        <div class="header"><i class="ri-user-line"></i> <h3>Profile</h3> <i class="ri-settings-line"></i></div>
        <div style="text-align: center; padding: 20px;">
            <img id="my-avatar" src="" class="avatar" style="width:100px; height:100px; border:none;">
            <h2 id="my-name">User</h2>
            <p id="my-bio" style="color:#888;">Loading...</p>
            <div class="action-row">
                <button class="action-btn" onclick="document.getElementById('edit-modal').style.display='flex'">Edit Profile</button>
                <button class="action-btn" onclick="alert('Opening Settings...')">Settings</button>
                <button class="action-btn" onclick="alert('Profile Link Copied!')">Share</button>
            </div>
        </div>
        <div style="padding: 20px;">
            <div style="background:var(--card-light); padding:20px; border-radius:15px; margin-bottom:10px;">
                <div style="color:#888; font-size:0.8rem;">FOLLOWERS</div>
                <div style="font-size:1.5rem; font-weight:bold;">128</div>
            </div>
            <div style="background:var(--card-light); padding:20px; border-radius:15px;">
                <div style="color:#888; font-size:0.8rem;">PROFILE VIEWS</div>
                <div style="font-size:1.5rem; font-weight:bold;">1.2k</div>
            </div>
        </div>
    </div>

    <div id="view-comments" class="view">
        <div class="header"><h1>Comments</h1></div>
        <div class="list-item">
            <img src="https://api.dicebear.com/7.x/initials/svg?seed=A" class="avatar">
            <div><h3>System</h3><p>Welcome to Nexus OS!</p></div>
        </div>
    </div>

    <div id="view-followers" class="view">
        <div class="header"><h1>Followers</h1></div>
        <div id="users-list"></div>
    </div>

    <div class="navbar">
        <div class="nav-item active" onclick="nav('explore')"><i class="ri-earth-line"></i> Explore</div>
        <div class="nav-item" onclick="nav('messages')"><i class="ri-chat-3-line"></i> Messaging</div>
        <div class="nav-item" onclick="nav('profile')"><i class="ri-user-line"></i> Profile</div>
        <div class="nav-item" onclick="nav('comments')"><i class="ri-discuss-line"></i> Comments</div>
        <div class="nav-item" onclick="nav('followers')"><i class="ri-group-line"></i> Followers</div>
    </div>

    <input type="file" id="postFile" style="display:none;" onchange="uploadPostFile()">
    <input type="file" id="attachFile" style="display:none;" onchange="sendAttachment()">

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let myUser = null;
        let currentRoom = "";

        // LOGIN
        function login() {
            const u = document.getElementById('username').value;
            if(u) {
                socket.emit('login', u);
                document.getElementById('login-modal').style.display='none';
            }
        }

        // NAV
        function nav(page) {
            document.querySelectorAll('.view').forEach(e => e.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(e => e.classList.remove('active'));
            
            const map = { 'explore':0, 'messages':1, 'profile':2, 'comments':3, 'followers':4 };
            document.getElementById('view-'+page).classList.add('active');
            document.querySelectorAll('.nav-item')[map[page]].classList.add('active');
        }

        // SOCKET DATA
        socket.on('user data', (user) => {
            myUser = user;
            document.getElementById('my-name').innerText = user.username;
            document.getElementById('my-bio').innerText = user.bio || "No bio yet";
            document.getElementById('my-avatar').src = user.avatar;
            document.getElementById('edit-bio').value = user.bio || "";
        });

        socket.on('profile updated', (bio) => {
            document.getElementById('my-bio').innerText = bio;
            document.getElementById('edit-modal').style.display='none';
        });

        socket.on('load users', (users) => {
            const list = document.getElementById('users-list');
            list.innerHTML = "";
            users.forEach(u => {
                list.innerHTML += `
                    <div class="list-item" onclick="openChat('${u.username}')">
                        <img src="${u.avatar}" class="avatar">
                        <div><h3>${u.username}</h3><p style="color:#666">Tap to chat</p></div>
                    </div>`;
            });
        });

        socket.on('load feed', (posts) => {
            const c = document.getElementById('feed-container');
            c.innerHTML = "";
            posts.forEach(p => {
                c.innerHTML += `
                    <div class="feed-card">
                        <img src="${p.content}" class="feed-img">
                        <div class="feed-info">
                            <b>${p.user}</b> ${p.caption}
                        </div>
                    </div>`;
            });
        });

        // CHAT
        function openChat(room) {
            currentRoom = room;
            document.getElementById('view-chat-room').classList.add('active');
            document.getElementById('room-title').innerText = room;
            document.getElementById('room-user').innerText = room;
            document.getElementById('room-avatar').src = `https://api.dicebear.com/7.x/initials/svg?seed=${room}`;
            socket.emit('join chat', room);
        }
        function closeChat() { document.getElementById('view-chat-room').classList.remove('active'); }

        function sendMsg() {
            const txt = document.getElementById('msg-input').value;
            if(txt) {
                socket.emit('chat message', { user: myUser.username, room: currentRoom, type: 'text', content: txt, avatar: myUser.avatar });
                document.getElementById('msg-input').value = "";
            }
        }

        function sendAttachment() {
            const file = document.getElementById('attachFile').files[0];
            const reader = new FileReader();
            reader.onload = e => {
                socket.emit('chat message', { user: myUser.username, room: currentRoom, type: 'image', content: e.target.result, avatar: myUser.avatar });
            };
            reader.readAsDataURL(file);
        }

        socket.on('load chat', msgs => {
            document.getElementById('msg-container').innerHTML = "";
            msgs.forEach(renderMsg);
        });
        socket.on('chat message', renderMsg);

        function renderMsg(msg) {
            const div = document.createElement('div');
            div.className = `msg ${msg.user === myUser.username ? 'msg-me' : 'msg-other'}`;
            if(msg.type === 'image') div.innerHTML = `<img src="${msg.content}" class="chat-image">`;
            else div.innerText = msg.content;
            
            const c = document.getElementById('msg-container');
            c.appendChild(div);
            c.scrollTop = c.scrollHeight;
        }

        // POST
        function uploadPostFile() {
            const file = document.getElementById('postFile').files[0];
            const reader = new FileReader();
            reader.onload = e => {
                const caption = prompt("Caption:");
                socket.emit('create post', { user: myUser.username, type: 'image', content: e.target.result, caption: caption || "", avatar: myUser.avatar });
            };
            reader.readAsDataURL(file);
        }

        // PROFILE
        function saveProfile() {
            const bio = document.getElementById('edit-bio').value;
            socket.emit('update profile', { username: myUser.username, bio });
        }
    </script>
</body>
</html>
