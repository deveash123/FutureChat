<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chat Minimal</title>
    
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#ffffff">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/724/724715.png">

    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #007AFF; /* Apple Blue */
            --bg: #F2F2F7;
            --white: #FFFFFF;
            --bubble-self: #007AFF;
            --bubble-other: #E9E9EB;
            --text-self: #FFFFFF;
            --text-other: #000000;
            --gray: #8E8E93;
        }

        body {
            margin: 0;
            background: var(--bg);
            font-family: 'Inter', sans-serif;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* --- 1. CLEAN HEADER --- */
        header {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(0,0,0,0.05);
            z-index: 100;
            position: sticky;
            top: 0;
        }

        .brand {
            font-weight: 600;
            font-size: 1.1rem;
            color: #000;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .user-pill {
            font-size: 0.8rem;
            color: var(--gray);
            font-weight: 500;
            background: rgba(0,0,0,0.05);
            padding: 4px 12px;
            border-radius: 20px;
        }

        /* --- 2. CHAT AREA --- */
        #messages {
            list-style: none;
            padding: 20px;
            padding-bottom: 120px; /* Space for input */
            margin: 0;
            flex-grow: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        /* Message Bubbles */
        li {
            padding: 10px 16px;
            border-radius: 18px;
            max-width: 80%;
            font-size: 0.95rem;
            line-height: 1.4;
            position: relative;
            word-wrap: break-word;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
            animation: fadeIn 0.2s ease;
        }

        .msg-name {
            font-size: 0.7rem;
            margin-bottom: 4px;
            font-weight: 600;
            opacity: 0.7;
        }

        /* My Messages (Right) */
        .my-message {
            align-self: flex-end;
            background: var(--bubble-self);
            color: var(--text-self);
            border-bottom-right-radius: 4px;
        }
        .my-message .msg-name { display: none; } /* Hide my name for clean look */

        /* Others Messages (Left) */
        .other-message {
            align-self: flex-start;
            background: var(--bubble-other);
            color: var(--text-other);
            border-bottom-left-radius: 4px;
        }
        .other-message .msg-name { color: var(--gray); }

        /* Media Styles */
        .chat-image {
            max-width: 100%;
            border-radius: 12px;
            margin-top: 5px;
        }
        
        audio {
            height: 30px;
            margin-top: 5px;
            max-width: 200px;
        }

        /* --- 3. INPUT BAR (Bottom) --- */
        form {
            position: fixed;
            bottom: 0; left: 0; width: 100%;
            background: var(--white);
            padding: 10px 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 -2px 20px rgba(0,0,0,0.05);
            padding-bottom: max(10px, env(safe-area-inset-bottom));
            box-sizing: border-box;
            z-index: 1000;
        }

        .input-wrapper {
            flex-grow: 1;
            background: #F2F2F7;
            border-radius: 25px;
            padding: 8px 15px;
            display: flex;
            align-items: center;
        }

        input {
            border: none;
            background: transparent;
            width: 100%;
            outline: none;
            font-size: 1rem;
            font-family: 'Inter', sans-serif;
        }

        /* Buttons */
        .btn-icon {
            border: none;
            background: transparent;
            color: var(--primary);
            font-size: 1.4rem;
            cursor: pointer;
            padding: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }

        .btn-icon:active { transform: scale(0.9); }
        .recording { color: #FF3B30 !important; animation: pulse 1s infinite; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.2); } 100% { transform: scale(1); } }

        /* --- LOGIN OVERLAY --- */
        #login-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--white);
            z-index: 5000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .login-input {
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 12px;
            width: 250px;
            font-size: 1rem;
            margin-bottom: 20px;
            text-align: center;
            background: #F9F9F9;
        }
        .login-btn {
            background: var(--primary);
            color: white;
            padding: 12px 40px;
            border-radius: 30px;
            border: none;
            font-weight: 600;
            font-size: 1rem;
        }
    </style>
</head>
<body>

    <div id="login-screen">
        <h1 style="font-weight:800; margin-bottom: 30px;">Chat</h1>
        <input type="text" id="username-input" class="login-input" placeholder="Your Name" autocomplete="off">
        <button class="login-btn" onclick="joinChat()">Continue</button>
    </div>

    <header>
        <div class="brand">Chat</div>
        <div class="user-pill" id="display-name">...</div>
    </header>

    <ul id="messages"></ul>

    <input type="file" id="fileInput" accept="image/*" style="display: none;">

    <form id="form" action="">
        <button type="button" class="btn-icon" onclick="document.getElementById('fileInput').click()">
            <i class="ri-camera-line"></i>
        </button>

        <button type="button" class="btn-icon" id="micBtn">
            <i class="ri-mic-line"></i>
        </button>

        <div class="input-wrapper">
            <input id="input" autocomplete="off" placeholder="Message..." />
        </div>

        <button class="btn-icon"><i class="ri-send-plane-fill"></i></button>
    </form>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        var socket = io();
        var myName = localStorage.getItem("chatName") || "";
        
        // --- LOGIN LOGIC ---
        if (myName) closeLogin();

        function joinChat() {
            var nameInput = document.getElementById("username-input");
            if (nameInput.value.trim() !== "") {
                myName = nameInput.value;
                localStorage.setItem("chatName", myName);
                closeLogin();
            }
        }
        function closeLogin() {
            document.getElementById("login-screen").style.display = "none";
            document.getElementById("display-name").innerText = myName;
        }

        // --- CHAT LOGIC ---
        var form = document.getElementById('form');
        var input = document.getElementById('input');
        var messages = document.getElementById('messages');
        var fileInput = document.getElementById('fileInput');

        // 1. Send Text
        form.addEventListener('submit', function(e) {
            e.preventDefault();
            if (input.value && myName) {
                var msgData = { user: myName, type: 'text', content: input.value };
                socket.emit('chat message', JSON.stringify(msgData));
                input.value = '';
                input.focus();
            }
        });

        // 2. Send Image (Compressed)
        fileInput.addEventListener('change', function() {
            const file = this.files[0];
            if (file && myName) {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        const MAX_WIDTH = 600;
                        const scaleFactor = MAX_WIDTH / img.width;
                        canvas.width = MAX_WIDTH;
                        canvas.height = img.height * scaleFactor;
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        const compressedData = canvas.toDataURL('image/jpeg', 0.6);
                        
                        var msgData = { user: myName, type: 'image', content: compressedData };
                        socket.emit('chat message', JSON.stringify(msgData));
                    }
                    img.src = evt.target.result;
                };
                reader.readAsDataURL(file);
                this.value = '';
            }
        });

        // 3. Audio Recorder Logic
        let mediaRecorder;
        let audioChunks = [];
        const micBtn = document.getElementById('micBtn');
        let isRecording = false;

        micBtn.addEventListener('click', async () => {
            if (!isRecording) {
                // START RECORDING
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    mediaRecorder.start();
                    
                    isRecording = true;
                    micBtn.classList.add('recording'); // Turn red
                    input.placeholder = "Recording audio...";
                    
                    audioChunks = [];
                    mediaRecorder.addEventListener("dataavailable", event => {
                        audioChunks.push(event.data);
                    });

                    mediaRecorder.addEventListener("stop", () => {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                        const reader = new FileReader();
                        reader.readAsDataURL(audioBlob);
                        reader.onloadend = () => {
                            const base64String = reader.result;
                            var msgData = { user: myName, type: 'audio', content: base64String };
                            socket.emit('chat message', JSON.stringify(msgData));
                        };
                    });
                } catch (err) {
                    alert("Microphone access denied or not supported.");
                }
            } else {
                // STOP RECORDING
                mediaRecorder.stop();
                isRecording = false;
                micBtn.classList.remove('recording');
                input.placeholder = "Message...";
            }
        });

        // 4. Receive Messages
        socket.on('chat message', function(msg) {
            var data;
            try { data = JSON.parse(msg); } catch(e) { return; }

            var item = document.createElement('li');
            item.classList.add(data.user === myName ? "my-message" : "other-message");

            let contentHtml = "";
            if (data.type === 'image') {
                contentHtml = `<img src="${data.content}" class="chat-image" />`;
            } else if (data.type === 'audio') {
                contentHtml = `<audio controls src="${data.content}"></audio>`;
            } else {
                contentHtml = data.content;
            }

            // Only show name for others
            if(data.user !== myName) {
                item.innerHTML = `<div class="msg-name">${data.user}</div> ${contentHtml}`;
            } else {
                item.innerHTML = contentHtml;
            }

            messages.appendChild(item);
            window.scrollTo(0, document.body.scrollHeight);
            messages.scrollTop = messages.scrollHeight;
        });
    </script>
</body>
</html>
