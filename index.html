<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FutureChat v2</title>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #00C6FF;
            --accent: #0072FF;
            --glass: rgba(255, 255, 255, 0.05);
            --border: 1px solid rgba(255, 255, 255, 0.1);
        }

        body {
            margin: 0;
            background: #050505;
            background-image: radial-gradient(circle at 50% 50%, rgba(0, 114, 255, 0.15) 0%, transparent 50%);
            font-family: 'Outfit', sans-serif;
            color: white;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- LOGIN SCREEN (OVERLAY) --- */
        #login-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(20px);
            z-index: 999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: 0.5s;
        }

        .login-box {
            background: var(--glass);
            padding: 40px;
            border-radius: 20px;
            border: var(--border);
            text-align: center;
            box-shadow: 0 0 50px rgba(0, 114, 255, 0.2);
        }

        .login-box h2 { margin-bottom: 20px; letter-spacing: 2px; }

        #username-input {
            padding: 15px;
            border-radius: 30px;
            border: none;
            outline: none;
            background: rgba(255,255,255,0.1);
            color: white;
            text-align: center;
            font-size: 1.2rem;
            margin-bottom: 20px;
            width: 200px;
        }

        .btn-enter {
            padding: 10px 40px;
            border-radius: 30px;
            border: none;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: white;
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
            transition: 0.3s;
        }

        .btn-enter:hover { box-shadow: 0 0 20px var(--primary); transform: scale(1.05); }

        /* --- HEADER --- */
        header {
            padding: 15px 20px;
            background: rgba(20, 20, 20, 0.8);
            border-bottom: var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
        }
        
        .brand { font-weight: 700; font-size: 1.2rem; display: flex; align-items: center; gap: 10px; }
        .brand i { color: var(--primary); }
        .user-badge { font-size: 0.9rem; color: #888; }

        /* --- CHAT AREA --- */
        #messages {
            list-style: none;
            padding: 20px;
            margin: 0;
            flex-grow: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            scroll-behavior: smooth;
        }

        #messages::-webkit-scrollbar { width: 4px; }
        #messages::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }

        li {
            padding: 10px 15px;
            border-radius: 15px;
            max-width: 80%;
            font-size: 0.95rem;
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            line-height: 1.4;
            display: flex;
            flex-direction: column;
        }

        .msg-name {
            font-size: 0.7rem;
            color: var(--primary);
            margin-bottom: 3px;
            font-weight: bold;
        }

        /* My Messages (Right) */
        .my-message {
            align-self: flex-end;
            background: linear-gradient(135deg, rgba(0, 198, 255, 0.2), rgba(0, 114, 255, 0.2));
            border: 1px solid rgba(0, 198, 255, 0.3);
            border-bottom-right-radius: 2px;
        }

        /* Others Messages (Left) */
        .other-message {
            align-self: flex-start;
            background: rgba(255, 255, 255, 0.08);
            border: var(--border);
            border-top-left-radius: 2px;
        }

        .other-message .msg-name { color: #ff00de; }

        /* --- INPUT --- */
        form {
            padding: 15px;
            background: rgba(0,0,0,0.8);
            display: flex;
            gap: 10px;
        }

        input {
            flex-grow: 1;
            background: rgba(255,255,255,0.1);
            border: none;
            padding: 12px 20px;
            border-radius: 30px;
            color: white;
            outline: none;
        }

        button {
            width: 45px; height: 45px;
            border-radius: 50%;
            border: none;
            background: var(--primary);
            color: black;
            font-size: 1.2rem;
            cursor: pointer;
        }

        @keyframes popIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-box">
            <h2>IDENTIFY</h2>
            <input type="text" id="username-input" placeholder="Enter Name..." autocomplete="off">
            <button class="btn-enter" onclick="joinChat()">ACCESS</button>
        </div>
    </div>

    <header>
        <div class="brand"><i class="ri-rfid-fill"></i> FutureChat</div>
        <div class="user-badge" id="display-name">Anonymous</div>
    </header>

    <ul id="messages"></ul>

    <form id="form" action="">
        <input id="input" autocomplete="off" placeholder="Type message..." />
        <button><i class="ri-send-plane-fill"></i></button>
    </form>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        var socket = io();
        var myName = "";

        // 1. Handle Login
        function joinChat() {
            var nameInput = document.getElementById("username-input");
            if (nameInput.value.trim() !== "") {
                myName = nameInput.value;
                document.getElementById("login-screen").style.opacity = "0";
                setTimeout(() => {
                    document.getElementById("login-screen").style.display = "none";
                }, 500);
                document.getElementById("display-name").innerText = "User: " + myName;
            }
        }

        // 2. Sending Messages (Now with JSON)
        var form = document.getElementById('form');
        var input = document.getElementById('input');
        var messages = document.getElementById('messages');

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            if (input.value && myName) {
                // Send an object: { user: "Harish", text: "Hello" }
                var msgData = { user: myName, text: input.value };
                socket.emit('chat message', JSON.stringify(msgData));
                input.value = '';
            }
        });

        // 3. Receiving Messages
        socket.on('chat message', function(msg) {
            // Try to parse JSON, if fails, it's old text format
            var data;
            try {
                data = JSON.parse(msg);
            } catch(e) {
                data = { user: "Unknown", text: msg };
            }

            var item = document.createElement('li');
            
            // Check if it's ME or OTHERS
            if (data.user === myName) {
                item.classList.add("my-message");
            } else {
                item.classList.add("other-message");
            }

            item.innerHTML = `<div class="msg-name">${data.user}</div> ${data.text}`;
            messages.appendChild(item);
            messages.scrollTop = messages.scrollHeight;
        });
    </script>
</body>
</html>
