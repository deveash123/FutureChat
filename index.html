<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chat Adaptive</title>
    
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
    
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/724/724715.png">

    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        /* --- 1. DEFAULT THEME (LIGHT MODE) --- */
        :root {
            --primary: #007AFF; 
            --bg: #F2F2F7;
            --header-bg: rgba(255, 255, 255, 0.85);
            --header-border: rgba(0,0,0,0.05);
            --text-main: #000000;
            --text-secondary: #8E8E93;
            
            --bubble-self: #007AFF;
            --text-self: #FFFFFF;
            
            --bubble-other: #E9E9EB;
            --text-other: #000000;
            
            --input-bar-bg: #FFFFFF;
            --input-field-bg: #F2F2F7;
            --icon-color: #007AFF;
        }

        /* --- 2. DARK MODE OVERRIDE (System Automatic) --- */
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #000000;
                --header-bg: rgba(20, 20, 20, 0.85);
                --header-border: rgba(255,255,255,0.1);
                --text-main: #FFFFFF;
                --text-secondary: #8E8E93;
                
                --bubble-self: #0A84FF; /* Slightly lighter blue for dark mode */
                --text-self: #FFFFFF;
                
                --bubble-other: #1C1C1E; /* Dark Gray */
                --text-other: #FFFFFF;
                
                --input-bar-bg: #000000;
                --input-field-bg: #1C1C1E;
                --icon-color: #0A84FF;
            }
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            transition: background 0.3s, color 0.3s; /* Smooth transition when switching */
        }

        /* --- HEADER --- */
        header {
            background: var(--header-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--header-border);
            z-index: 100;
            position: sticky;
            top: 0;
        }

        .brand { font-weight: 600; font-size: 1.1rem; display: flex; align-items: center; gap: 8px; }
        .user-pill {
            font-size: 0.8rem;
            color: var(--text-secondary);
            font-weight: 500;
            background: var(--input-field-bg);
            padding: 4px 12px;
            border-radius: 20px;
        }

        /* --- CHAT AREA --- */
        #messages {
            list-style: none;
            padding: 20px;
            padding-bottom: 120px;
            margin: 0;
            flex-grow: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        li {
            padding: 10px 16px;
            border-radius: 18px;
            max-width: 80%;
            font-size: 0.95rem;
            line-height: 1.4;
            position: relative;
            word-wrap: break-word;
            animation: fadeIn 0.2s ease;
        }

        .msg-name { font-size: 0.7rem; margin-bottom: 4px; font-weight: 600; opacity: 0.7; }

        .my-message {
            align-self: flex-end;
            background: var(--bubble-self);
            color: var(--text-self);
            border-bottom-right-radius: 4px;
        }
        .my-message .msg-name { display: none; }

        .other-message {
            align-self: flex-start;
            background: var(--bubble-other);
            color: var(--text-other);
            border-bottom-left-radius: 4px;
        }
        .other-message .msg-name { color: var(--text-secondary); }

        .chat-image { max-width: 100%; border-radius: 12px; margin-top: 5px; }
        audio { height: 35px; margin-top: 5px; max-width: 220px; }

        /* --- INPUT BAR --- */
        form {
            position: fixed;
            bottom: 0; left: 0; width: 100%;
            background: var(--input-bar-bg);
            border-top: 1px solid var(--header-border);
            padding: 10px 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            padding-bottom: max(10px, env(safe-area-inset-bottom));
            box-sizing: border-box;
            z-index: 1000;
        }

        .input-wrapper {
            flex-grow: 1;
            background: var(--input-field-bg);
            border-radius: 25px;
            padding: 8px 15px;
            display: flex;
            align-items: center;
        }

        input {
            border: none;
            background: transparent;
            width: 100%;
            outline: none;
            font-size: 1rem;
            color: var(--text-main); /* Adaptive Text Color */
            font-family: 'Inter', sans-serif;
        }

        .btn-icon {
            border: none;
            background: transparent;
            color: var(--icon-color);
            font-size: 1.4rem;
            cursor: pointer;
            padding: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .recording { color: #FF3B30 !important; animation: pulse 1s infinite; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.2); } 100% { transform: scale(1); } }

        /* --- LOGIN OVERLAY --- */
        #login-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--input-bar-bg); /* Adapts to dark mode */
            z-index: 5000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .login-input {
            padding: 15px;
            border: 1px solid var(--header-border);
            border-radius: 12px;
            width: 250px;
            font-size: 1rem;
            margin-bottom: 20px;
            text-align: center;
            background: var(--input-field-bg);
            color: var(--text-main);
        }
        .login-btn {
            background: var(--primary);
            color: white;
            padding: 12px 40px;
            border-radius: 30px;
            border: none;
            font-weight: 600;
            font-size: 1rem;
        }
        #login-screen h1 { color: var(--text-main); }
    </style>
</head>
<body>

    <div id="login-screen">
        <h1 style="font-weight:800; margin-bottom: 30px;">Chat</h1>
        <input type="text" id="username-input" class="login-input" placeholder="Your Name" autocomplete="off">
        <button class="login-btn" onclick="joinChat()">Continue</button>
    </div>

    <header>
        <div class="brand">Chat</div>
        <div class="user-pill" id="display-name">...</div>
    </header>

    <ul id="messages"></ul>

    <input type="file" id="fileInput" accept="image/*" style="display: none;">

    <form id="form" action="">
        <button type="button" class="btn-icon" onclick="document.getElementById('fileInput').click()">
            <i class="ri-camera-line"></i>
        </button>
        <button type="button" class="btn-icon" id="micBtn">
            <i class="ri-mic-line"></i>
        </button>
        <div class="input-wrapper">
            <input id="input" autocomplete="off" placeholder="Message..." />
        </div>
        <button class="btn-icon"><i class="ri-send-plane-fill"></i></button>
    </form>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        var socket = io();
        var myName = localStorage.getItem("chatName") || "";
        
        if (myName) closeLogin();

        function joinChat() {
            var nameInput = document.getElementById("username-input");
            if (nameInput.value.trim() !== "") {
                myName = nameInput.value;
                localStorage.setItem("chatName", myName);
                closeLogin();
            }
        }
        function closeLogin() {
            document.getElementById("login-screen").style.display = "none";
            document.getElementById("display-name").innerText = myName;
        }

        var form = document.getElementById('form');
        var input = document.getElementById('input');
        var messages = document.getElementById('messages');
        var fileInput = document.getElementById('fileInput');

        // Text
        form.addEventListener('submit', function(e) {
            e.preventDefault();
            if (input.value && myName) {
                var msgData = { user: myName, type: 'text', content: input.value };
                socket.emit('chat message', JSON.stringify(msgData));
                input.value = '';
                input.focus();
            }
        });

        // Image
        fileInput.addEventListener('change', function() {
            const file = this.files[0];
            if (file && myName) {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        const MAX_WIDTH = 600;
                        const scaleFactor = MAX_WIDTH / img.width;
                        canvas.width = MAX_WIDTH;
                        canvas.height = img.height * scaleFactor;
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        const compressedData = canvas.toDataURL('image/jpeg', 0.6);
                        
                        var msgData = { user: myName, type: 'image', content: compressedData };
                        socket.emit('chat message', JSON.stringify(msgData));
                    }
                    img.src = evt.target.result;
                };
                reader.readAsDataURL(file);
                this.value = '';
            }
        });

        // Audio
        let mediaRecorder;
        let audioChunks = [];
        const micBtn = document.getElementById('micBtn');
        let isRecording = false;

        micBtn.addEventListener('click', async () => {
            if (!isRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    mediaRecorder.start();
                    isRecording = true;
                    micBtn.classList.add('recording'); 
                    input.placeholder = "Recording audio...";
                    audioChunks = [];
                    mediaRecorder.addEventListener("dataavailable", event => { audioChunks.push(event.data); });
                    mediaRecorder.addEventListener("stop", () => {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                        const reader = new FileReader();
                        reader.readAsDataURL(audioBlob);
                        reader.onloadend = () => {
                            var msgData = { user: myName, type: 'audio', content: reader.result };
                            socket.emit('chat message', JSON.stringify(msgData));
                        };
                    });
                } catch (err) { alert("Microphone not supported."); }
            } else {
                mediaRecorder.stop();
                isRecording = false;
                micBtn.classList.remove('recording');
                input.placeholder = "Message...";
            }
        });

        // Receive
        socket.on('chat message', function(msg) {
            var data;
            try { data = JSON.parse(msg); } catch(e) { return; }
            var item = document.createElement('li');
            item.classList.add(data.user === myName ? "my-message" : "other-message");

            let contentHtml = "";
            if (data.type === 'image') contentHtml = `<img src="${data.content}" class="chat-image" />`;
            else if (data.type === 'audio') contentHtml = `<audio controls src="${data.content}"></audio>`;
            else contentHtml = data.content;

            if(data.user !== myName) item.innerHTML = `<div class="msg-name">${data.user}</div> ${contentHtml}`;
            else item.innerHTML = contentHtml;

            messages.appendChild(item);
            window.scrollTo(0, document.body.scrollHeight);
            messages.scrollTop = messages.scrollHeight;
        });
    </script>
</body>
</html>
