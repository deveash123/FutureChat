<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FutureChat v4 (App Mode)</title>
    
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#000000">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/724/724715.png">

    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #00C6FF;
            --accent: #0072FF;
            --glass: rgba(255, 255, 255, 0.05);
            --border: 1px solid rgba(255, 255, 255, 0.1);
        }

        body {
            margin: 0;
            background: #050505;
            background-image: radial-gradient(circle at 50% 50%, rgba(0, 114, 255, 0.15) 0%, transparent 50%);
            font-family: 'Outfit', sans-serif;
            color: white;
            height: 100vh;
            height: 100dvh; 
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- LOGIN SCREEN --- */
        #login-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            backdrop-filter: blur(20px);
            z-index: 2000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: 0.5s;
        }

        .login-box {
            background: var(--glass);
            padding: 30px;
            border-radius: 20px;
            border: var(--border);
            text-align: center;
            width: 80%;
            max-width: 300px;
        }

        #username-input {
            padding: 15px;
            border-radius: 30px;
            border: 1px solid #333;
            outline: none;
            background: rgba(255,255,255,0.1);
            color: white;
            text-align: center;
            font-size: 1.1rem;
            margin-bottom: 20px;
            width: 100%;
            box-sizing: border-box;
        }

        .btn-enter {
            padding: 12px 40px;
            border-radius: 30px;
            border: none;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: white;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }

        /* --- HEADER --- */
        header {
            padding: 15px 20px;
            background: rgba(10, 10, 10, 0.9);
            border-bottom: var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
        }
        
        .brand { font-weight: 700; font-size: 1.1rem; display: flex; align-items: center; gap: 8px; }
        .brand i { color: var(--primary); }
        .user-badge { font-size: 0.8rem; color: #aaa; background: rgba(255,255,255,0.1); padding: 5px 10px; border-radius: 10px;}

        /* --- CHAT AREA --- */
        #messages {
            list-style: none;
            padding: 20px;
            padding-bottom: 100px; 
            margin: 0;
            flex-grow: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            scroll-behavior: smooth;
        }

        li {
            padding: 10px 16px;
            border-radius: 18px;
            max-width: 85%;
            font-size: 0.95rem;
            line-height: 1.4;
            display: flex;
            flex-direction: column;
            word-wrap: break-word;
            animation: popIn 0.3s ease;
        }

        .msg-name { font-size: 0.7rem; margin-bottom: 4px; opacity: 0.8; font-weight: bold; }

        .my-message {
            align-self: flex-end;
            background: linear-gradient(135deg, rgba(0, 198, 255, 0.2), rgba(0, 114, 255, 0.2));
            border: 1px solid rgba(0, 198, 255, 0.3);
            border-bottom-right-radius: 4px;
        }
        .my-message .msg-name { color: #80dfff; text-align: right; }

        .other-message {
            align-self: flex-start;
            background: rgba(255, 255, 255, 0.1);
            border: var(--border);
            border-top-left-radius: 4px;
        }
        .other-message .msg-name { color: #ff00de; }

        /* --- INPUT BAR --- */
        form {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 15px;
            background: rgba(0,0,0,0.95);
            border-top: var(--border);
            display: flex;
            gap: 10px;
            z-index: 1000;
            box-sizing: border-box;
            padding-bottom: env(safe-area-inset-bottom, 20px);
        }

        input {
            flex-grow: 1;
            background: rgba(255,255,255,0.1);
            border: none;
            padding: 12px 20px;
            border-radius: 30px;
            color: white;
            outline: none;
            font-size: 1rem;
        }

        button {
            width: 48px; height: 48px;
            border-radius: 50%;
            border: none;
            background: var(--primary);
            color: black;
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        @keyframes popIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-box">
            <h2 style="margin-top:0; color:white;">IDENTIFY</h2>
            <input type="text" id="username-input" placeholder="Your Name" autocomplete="off">
            <button class="btn-enter" onclick="joinChat()">Start Chatting</button>
        </div>
    </div>

    <header>
        <div class="brand"><i class="ri-rfid-fill"></i> FutureChat</div>
        <div class="user-badge" id="display-name">...</div>
    </header>

    <ul id="messages"></ul>

    <form id="form" action="">
        <input id="input" autocomplete="off" placeholder="Type here..." />
        <button><i class="ri-send-plane-fill"></i></button>
    </form>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        var socket = io();
        var myName = localStorage.getItem("chatName") || "";

        if (myName) {
            closeLogin();
        }

        function joinChat() {
            var nameInput = document.getElementById("username-input");
            if (nameInput.value.trim() !== "") {
                myName = nameInput.value;
                localStorage.setItem("chatName", myName);
                closeLogin();
            }
        }

        function closeLogin() {
            document.getElementById("login-screen").style.opacity = "0";
            setTimeout(() => {
                document.getElementById("login-screen").style.display = "none";
            }, 500);
            document.getElementById("display-name").innerText = myName;
        }

        var form = document.getElementById('form');
        var input = document.getElementById('input');
        var messages = document.getElementById('messages');

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            if (input.value && myName) {
                var msgData = { user: myName, text: input.value };
                socket.emit('chat message', JSON.stringify(msgData));
                input.value = '';
                input.focus();
            }
        });

        socket.on('chat message', function(msg) {
            var data;
            try { data = JSON.parse(msg); } catch(e) { data = { user: "Anon", text: msg }; }

            var item = document.createElement('li');
            if (data.user === myName) {
                item.classList.add("my-message");
            } else {
                item.classList.add("other-message");
            }

            item.innerHTML = `<div class="msg-name">${data.user}</div> ${data.text}`;
            messages.appendChild(item);
            window.scrollTo(0, document.body.scrollHeight);
            messages.scrollTop = messages.scrollHeight;
        });
    </script>
</body>
</html>
