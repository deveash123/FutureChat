<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Social Chat OS</title>
    
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#000000">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/724/724715.png">
    
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

    <style>
        :root {
            --bg: #000000;
            --card-bg: #121212;
            --text: #ffffff;
            --accent: #0095f6; /* Insta Blue */
            --heart: #ff3040;
            --border: 1px solid #262626;
        }

        body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Outfit', sans-serif; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }

        /* --- NAVIGATION --- */
        .bottom-nav {
            position: fixed; bottom: 0; width: 100%; height: 60px;
            background: var(--bg); border-top: var(--border);
            display: flex; justify-content: space-around; align-items: center;
            z-index: 100;
        }
        .nav-btn { font-size: 1.5rem; color: #fff; background: none; border: none; cursor: pointer; opacity: 0.6; }
        .nav-btn.active { opacity: 1; color: var(--text); }
        .add-btn { font-size: 2rem; color: var(--accent); opacity: 1; }

        /* --- VIEWS --- */
        .view-container { flex-grow: 1; overflow-y: auto; padding-bottom: 70px; display: none; }
        .view-container.active { display: block; }

        /* --- HOME FEED (INSTAGRAM STYLE) --- */
        .post-card {
            background: var(--card-bg); margin-bottom: 15px; border-bottom: var(--border);
        }
        .post-header {
            padding: 10px; display: flex; align-items: center; gap: 10px;
        }
        .user-avatar { width: 32px; height: 32px; border-radius: 50%; border: 1px solid #333; }
        .post-user { font-weight: 600; font-size: 0.9rem; }
        
        .post-media { width: 100%; max-height: 500px; object-fit: cover; background: #000; }
        
        .post-actions { padding: 10px; display: flex; gap: 15px; font-size: 1.5rem; }
        .action-icon { cursor: pointer; transition: 0.2s; }
        .liked { color: var(--heart); animation: pop 0.3s; }
        
        .post-info { padding: 0 10px 15px 10px; }
        .likes-count { font-weight: bold; margin-bottom: 5px; display: block; }
        .caption { margin-bottom: 8px; }
        .comments-section { font-size: 0.85rem; color: #aaa; }
        .comment-item { margin-top: 4px; color: #ddd; }
        
        /* --- CHAT VIEW --- */
        #chat-view { display: flex; flex-direction: column; height: 100%; }
        #messages { flex-grow: 1; overflow-y: auto; padding: 15px; list-style: none; display: flex; flex-direction: column; gap: 10px; }
        .msg-bubble { padding: 10px 15px; border-radius: 20px; max-width: 75%; font-size: 0.95rem; }
        .my-msg { align-self: flex-end; background: #3797f0; }
        .other-msg { align-self: flex-start; background: #262626; }
        
        .chat-input-area {
            padding: 10px; background: #000; display: flex; align-items: center; gap: 10px; border-top: var(--border);
        }
        .chat-input {
            flex-grow: 1; background: #262626; border: none; border-radius: 20px;
            padding: 10px 15px; color: white; outline: none;
        }

        /* --- UPLOAD MODAL --- */
        #upload-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 200; display: none;
            flex-direction: column; align-items: center; justify-content: center;
        }
        .upload-card { background: #262626; padding: 20px; border-radius: 15px; width: 80%; text-align: center; }
        .upload-preview { max-width: 100%; max-height: 200px; margin: 10px 0; border-radius: 10px; }
        
        /* LOGIN */
        #login-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 5000; display: flex; align-items: center; justify-content: center; flex-direction: column;}
        .login-input { padding: 15px; margin: 10px; background: #262626; border: 1px solid #333; color: white; border-radius: 5px; width: 250px; }
        
        @keyframes pop { 0% { transform: scale(1); } 50% { transform: scale(1.3); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

    <div id="login-screen">
        <h1 style="font-family:'cursive'; font-size: 2.5rem; margin-bottom:20px;">Social OS</h1>
        <input id="uName" class="login-input" placeholder="Username" autocomplete="off">
        <input id="rName" class="login-input" placeholder="Room/Group Name" autocomplete="off">
        <button onclick="login()" style="padding:10px 30px; background:var(--accent); border:none; color:white; font-weight:bold; border-radius:5px; cursor:pointer;">Log In</button>
    </div>

    <div id="upload-modal">
        <div class="upload-card">
            <h3>New Post</h3>
            <input type="file" id="postFile" accept="image/*,video/*" style="display:none" onchange="previewPost()">
            <button onclick="document.getElementById('postFile').click()" style="padding:10px; background:#333; color:white; border:none; border-radius:5px;">Select Photo/Reel</button>
            <div id="preview-container"></div>
            <input id="postCaption" placeholder="Write a caption..." style="width:100%; padding:10px; margin-top:10px; background:#121212; border:none; color:white; outline:none;">
            <div style="display:flex; gap:10px; margin-top:15px; justify-content:center;">
                <button onclick="closeUpload()" style="background:none; border:none; color:#aaa; cursor:pointer;">Cancel</button>
                <button onclick="uploadPost()" style="background:var(--accent); color:white; border:none; padding:8px 20px; border-radius:5px; font-weight:bold; cursor:pointer;">Share</button>
            </div>
        </div>
    </div>

    <div id="feed-view" class="view-container active">
        <div style="padding:15px; border-bottom:var(--border); font-family:'cursive'; font-size:1.5rem;">Social Feed</div>
        <div id="feed-list">
            </div>
    </div>

    <div id="chat-view" class="view-container">
        <div style="padding:15px; background:#121212; border-bottom:var(--border); display:flex; justify-content:space-between;">
            <span style="font-weight:bold;" id="chat-title">Chat</span>
            <i class="ri-information-line"></i>
        </div>
        <ul id="messages"></ul>
        <form class="chat-input-area" id="chat-form">
            <i class="ri-add-circle-line" style="font-size:1.5rem; color:#fff;"></i>
            <input id="msgInput" class="chat-input" placeholder="Message..." autocomplete="off">
            <button style="background:none; border:none; color:var(--accent); font-weight:bold; font-size:1rem;">Send</button>
        </form>
    </div>

    <div class="bottom-nav">
        <button class="nav-btn active" onclick="switchTab('feed')"><i class="ri-home-5-fill"></i></button>
        <button class="nav-btn add-btn" onclick="openUpload()"><i class="ri-add-box-fill"></i></button>
        <button class="nav-btn" onclick="switchTab('chat')"><i class="ri-messenger-fill"></i></button>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        var socket = io();
        var myName = localStorage.getItem("chatName") || "";
        var myRoom = localStorage.getItem("chatRoom") || "";
        var postData = null; // Temp storage for upload

        if(myName && myRoom) {
            document.getElementById("uName").value = myName;
            document.getElementById("rName").value = myRoom;
        }

        function login() {
            var u = document.getElementById("uName").value.trim();
            var r = document.getElementById("rName").value.trim();
            if(u && r) {
                myName = u; myRoom = r;
                localStorage.setItem("chatName", myName);
                localStorage.setItem("chatRoom", myRoom);
                document.getElementById("login-screen").style.display = "none";
                document.getElementById("chat-title").innerText = myRoom;
                
                socket.emit('join room', { user: myName, room: myRoom });
            }
        }

        function switchTab(tab) {
            document.querySelectorAll('.view-container').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
            
            if(tab === 'feed') {
                document.getElementById('feed-view').classList.add('active');
                document.querySelector('.ri-home-5-fill').parentElement.classList.add('active');
            } else {
                document.getElementById('chat-view').classList.add('active');
                document.querySelector('.ri-messenger-fill').parentElement.classList.add('active');
            }
        }

        // --- FEED LOGIC ---
        function openUpload() { document.getElementById('upload-modal').style.display = 'flex'; }
        function closeUpload() { document.getElementById('upload-modal').style.display = 'none'; postData = null; document.getElementById('preview-container').innerHTML = ""; }

        function previewPost() {
            const file = document.getElementById('postFile').files[0];
            if(file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    postData = { type: file.type.startsWith('video') ? 'video' : 'image', content: e.target.result };
                    let html = postData.type === 'video' 
                        ? `<video src="${postData.content}" class="upload-preview" controls></video>`
                        : `<img src="${postData.content}" class="upload-preview">`;
                    document.getElementById('preview-container').innerHTML = html;
                }
                reader.readAsDataURL(file);
            }
        }

        function uploadPost() {
            if(postData) {
                const caption = document.getElementById('postCaption').value;
                socket.emit('create post', { user: myName, ...postData, caption });
                closeUpload();
            }
        }

        // --- RENDER POSTS ---
        socket.on('load feed', (posts) => {
            document.getElementById('feed-list').innerHTML = "";
            posts.forEach(renderPost);
        });
        socket.on('new post', (post) => {
            document.getElementById('feed-list').prepend(createPostElement(post));
        });
        socket.on('update post', (post) => {
            // Replace existing card with updated one (simple refresh)
            let existing = document.getElementById(`post-${post._id}`);
            if(existing) existing.outerHTML = createPostElement(post).outerHTML;
        });

        function renderPost(post) {
            document.getElementById('feed-list').appendChild(createPostElement(post));
        }

        function createPostElement(post) {
            let div = document.createElement('div');
            div.className = 'post-card';
            div.id = `post-${post._id}`;
            
            let isLiked = post.likes.includes(myName);
            let heartIcon = isLiked ? 'ri-heart-3-fill liked' : 'ri-heart-3-line';
            
            let mediaHtml = post.type === 'video' 
                ? `<video src="${post.content}" class="post-media" controls loop></video>` 
                : `<img src="${post.content}" class="post-media">`;

            let commentsHtml = post.comments.map(c => `
                <div class="comment-item"><b>${c.user}</b> ${c.text}</div>
            `).join('');

            div.innerHTML = `
                <div class="post-header">
                    <img src="${post.avatar}" class="user-avatar">
                    <div class="post-user">${post.user}</div>
                </div>
                ${mediaHtml}
                <div class="post-actions">
                    <i class="${heartIcon} action-icon" onclick="likePost('${post._id}')"></i>
                    <i class="ri-chat-3-line action-icon" onclick="focusComment('${post._id}')"></i>
                    <i class="ri-send-plane-fill action-icon"></i>
                </div>
                <div class="post-info">
                    <span class="likes-count">${post.likes.length} likes</span>
                    <div class="caption"><b>${post.user}</b> ${post.caption}</div>
                    <div class="comments-section">${commentsHtml}</div>
                    <form onsubmit="sendComment(event, '${post._id}')" style="margin-top:10px; display:flex;">
                        <input id="comment-${post._id}" placeholder="Add a comment..." style="background:none; border:none; color:white; width:100%; outline:none; font-size:0.9rem;">
                        <button style="background:none; border:none; color:var(--accent); font-weight:bold; cursor:pointer;">Post</button>
                    </form>
                </div>
            `;
            return div;
        }

        function likePost(id) { socket.emit('like post', { postId: id, user: myName }); }
        
        function sendComment(e, id) {
            e.preventDefault();
            let input = document.getElementById(`comment-${id}`);
            if(input.value) {
                socket.emit('comment post', { postId: id, user: myName, text: input.value });
                input.value = '';
            }
        }
        function focusComment(id) { document.getElementById(`comment-${id}`).focus(); }


        // --- CHAT LOGIC (Simplified) ---
        document.getElementById('chat-form').addEventListener('submit', function(e) {
            e.preventDefault();
            let input = document.getElementById('msgInput');
            if(input.value) {
                socket.emit('chat message', { user: myName, room: myRoom, type: 'text', content: input.value });
                input.value = '';
            }
        });

        socket.on('load chat', (msgs) => msgs.forEach(renderMsg));
        socket.on('chat message', renderMsg);

        function renderMsg(msg) {
            let li = document.createElement('li');
            li.className = `msg-bubble ${msg.user === myName ? 'my-msg' : 'other-msg'}`;
            li.innerText = msg.content;
            document.getElementById('messages').appendChild(li);
            document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
        }
    </script>
</body>
</html>
